; PlatformIO Project Configuration File
;
; egasumi NFC reader: ST25R300 + Raspberry Pi Pico 2
; Continuous NFC-A / ISO/IEC 14443A UID inventory, alternating two antenna coils.

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
; upload_protocol = cmsis-dap
upload_protocol = picotool
monitor_speed = 115200

build_flags =
  -I$PROJECT_DIR/include
  -DRFAL_CMATH

; USB stack: the core's native device stack, not Adafruit TinyUSB.
;
; The Arduino Keyboard library (which provides the standard 6-keycode-plus-
; modifiers boot-keyboard report) drives the core's native stack and #errors out
; if USE_TINYUSB is defined, so that flag is deliberately absent. The native
; stack composes CDC (Serial) and HID into one composite device, which is what
; keyboard mode needs.
;
; tusb-hid supplies the TinyUSB HID device sources (hid_device.c) so symbols
; such as tud_hid_n_keyboard_report link. include/tusb-hid.h stands in for the
; core's header-only stub that HID_Keyboard.h includes.
lib_deps =
  tusb-hid
  HID_Keyboard
  Keyboard
